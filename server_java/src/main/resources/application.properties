spring.application.name=terragrid-java

# Database configuration (overridden by environment variables in production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/terragrid}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mnaim1}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Custom security properties
terragrid.jwt.secret=${JWT_SECRET:yoursupersecretjwtsecretkeythatisatleast256bitslong}
terragrid.jwt.expiration=${JWT_EXPIRATION:86400000}

# Port configuration (mapped automatically by hosting providers via PORT env variable)
server.port=${PORT:5001}

# CORS Configuration (comma-separated list of allowed origins)
terragrid.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
